set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g escape-time 10
set -g focus-events on
set -g status-interval 15
set -g status-style "bg=#1e293b,fg=#f8fafc"
set -g status-left "#[bg=#2563eb,fg=#ffffff,bold] GEMINI-BASTION #[bg=#1e293b,fg=#93c5fd] [#S] "
set -g status-right "#[fg=#cbd5e1]%Y-%m-%d %H:%M UTC "
setw -g window-status-current-style "bg=#334155,fg=#38bdf8,bold"

# Persistent session saving across reboots
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~gemini->gemini --resume latest --approval-mode=yolo --no-sandbox -m gemini-4-argon"'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run-shell /home/danipan/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell /home/danipan/.tmux/plugins/tmux-continuum/continuum.tmux
